<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk-calculator | Оценка риска ССЗ</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1>❤️ Risk-calculator</h1>
        <p>Введите ваши данные для расчёта 10-летнего риска сердечно-сосудистых заболеваний</p>

        <div class="form-container">
            <form id="riskForm">
                <div class="row">
                    <div class="col">
                        <label>Возраст (лет):</label>
                        <input type="number" id="age" value="45" min="18" max="100" step="1">
                    </div>
                    <div class="col">
                        <label>Пол:</label>
                        <select id="sex">
                            <option value="1">Мужской</option>
                            <option value="0">Женский</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Курение:</label>
                        <select id="smoking">
                            <option value="0">Нет</option>
                            <option value="1">Да</option>
                        </select>
                    </div>
                    <div class="col">
                        <label>Диабет:</label>
                        <select id="diabetes">
                            <option value="0">Нет</option>
                            <option value="1">Да</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Гипертония:</label>
                        <select id="hypertension">
                            <option value="0">Нет</option>
                            <option value="1">Да</option>
                        </select>
                    </div>
                    <div class="col">
                        <label>Холестерин (мг/дл):</label>
                        <input type="number" id="cholesterol" value="200" step="10" min="100" max="400">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Давление (систолическое):</label>
                        <input type="number" id="systolic_bp" value="120" step="5" min="80" max="200">
                    </div>
                    <div class="col">
                        <label>Давление (диастолическое):</label>
                        <input type="number" id="diastolic_bp" value="80" step="5" min="40" max="130">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Рост (см):</label>
                        <input type="number" id="height" value="170" step="5" min="100" max="220">
                    </div>
                    <div class="col">
                        <label>Вес (кг):</label>
                        <input type="number" id="weight" value="70" step="5" min="30" max="200">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Пульс (уд/мин):</label>
                        <input type="number" id="pulse" value="72" step="5" min="40" max="200">
                    </div>
                    <div class="col">
                        <label>Глюкоза (мг/дл):</label>
                        <input type="number" id="glucose" value="95" step="5" min="50" max="400">
                    </div>
                </div>

                <button type="button">Рассчитать риск</button>
            </form>
        </div>

        <div id="results" style="display: none;">
            <h2>📊 Результаты оценки</h2>
            
            <div class="risk-score">
                <span class="label">10-летний риск ССЗ:</span>
                <span class="value" id="totalRisk">0%</span>
            </div>

            <div class="risk-level" id="riskLevel"></div>

            <div class="charts">
                <canvas id="factorsChart" width="400" height="300"></canvas>
            </div>

            <div class="factors-list">
                <h3>⚠️ Факторы риска</h3>
                <ul id="factorsUl"></ul>
            </div>

            <div class="prediction-info" id="predictionInfo"></div>
        </div>
    </div>

    <script src="static/js/script.js"></script>
</body>
</html>
